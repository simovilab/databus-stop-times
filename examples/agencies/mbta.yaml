# MBTA — public GTFS-RT JSON + GTFS static.
name: mbta
gtfs_static_url: https://cdn.mbta.com/MBTA_GTFS.zip
vehicle_positions_url: https://cdn.mbta.com/realtime/VehiclePositions.json
trip_updates_url: https://cdn.mbta.com/realtime/TripUpdates.json
poll_interval_s: 15

# Optional request headers (e.g. API key). MBTA public feeds need none.
headers: {}

# Ground-truth detector parameters.
arrival_radius_m: 40.0
dwell_s: 0.0
shape_threshold_m: 30.0

# Agency profile (stoptimes.core.config): timezone + holiday-calendar region
# for temporal feature extraction (train and serve resolve through this same
# file, so a given timestamp produces identical features either way). MBTA
# has no served-model pin -- serving falls through to the registry's
# metric-only best-model ranking.
timezone: America/New_York
holiday_region: US_MA
serving:
  primary_model: null
  fallback_model: null
