name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, models, serve, record, train, val, cli]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --group dev --frozen

      - name: Run tests
        run: uv run --no-sync python -m pytest packages/${{ matrix.package }} -q -p no:cacheprovider

  e2e:
    name: e2e (the Phase 2 gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --group dev --frozen

      - name: Raw feed to scored predictions
        run: uv run --no-sync python -m pytest tests/e2e -q -p no:cacheprovider

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --group dev --frozen

      - name: Run ruff
        run: uv run --no-sync ruff check .
