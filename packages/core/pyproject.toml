[project]
name = "stoptimes-core"
version = "0.1.0"
description = "Shared foundations: GTFS static + realtime readers, domain models, spatial map-matching, temporal features, contracts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "holidays>=0.40",
]

[project.optional-dependencies]
# GTFS-RT protobuf feeds (JSON feeds need nothing extra).
pb = ["gtfs-realtime-bindings>=1.0.0"]
# Reading and writing archive parquet.
parquet = ["pyarrow>=16.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stoptimes"]
