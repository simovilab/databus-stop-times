[project]
name = "stoptimes"
version = "0.1.0"
description = "One command for the whole toolkit: data, record, train, models, serve, val."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
core = ["stoptimes-core"]
models = ["stoptimes-models"]
record = ["stoptimes-record"]
train = ["stoptimes-train"]
tui = ["stoptimes-train[tui]"]
serve = ["stoptimes-serve[xgboost]"]
val = ["stoptimes-val[api,models]"]
all = ["stoptimes[core,models,record,train,tui,serve,val]"]

[project.scripts]
stoptimes = "stoptimes.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stoptimes"]
