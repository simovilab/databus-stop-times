[project]
name = "stoptimes-serve"
version = "0.1.0"
description = "Inference: load a model, run the (customizable) prediction pipeline, publish GTFS-RT TripUpdates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "stoptimes-core",
    "stoptimes-models",
]

[project.optional-dependencies]
xgboost = ["stoptimes-models[xgboost]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stoptimes"]
