[project]
name = "stoptimes-record"
version = "0.1.0"
description = "Record live GTFS-RT feeds into a compacted, queryable archive (local or S3)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "stoptimes-core",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.1.0",
    "requests>=2.32",
    "gtfs-realtime-bindings>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stoptimes"]
