[project]
name = "stoptimes-models"
version = "0.1.0"
description = "Model families (historical mean, polyreg, EWMA, XGBoost, LSTM) and the model registry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "stoptimes-core",
    "scikit-learn>=1.7.2",
]

[project.optional-dependencies]
xgboost = ["xgboost>=3.1.2"]
# torch dropped macOS x86_64 wheels after 2.2.2; Python 3.12 is the newest it supports.
torch = ["torch>=2.2,<2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stoptimes"]
