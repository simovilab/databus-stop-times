[project]
name = "etaval"
version = "0.1.0"
description = "ETA Prediction Validation Tool — collects GTFS-RT arrival predictions, detects actual arrivals, and scores prediction error against horizon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dotjae" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    # gtfs-eta's inference-only package (eta_service, models.common.registry,
    # feature_engineering.temporal, core) — see etaval/predictors/gtfs_eta_models.py.
    "eta_prediction",
    # eta_prediction's base dependencies deliberately exclude xgboost (see the
    # comment in gtfs-eta/pyproject.toml — it's a training-only extra there),
    # but unpickling a trained models.xgb.train.XGBTimeModel needs the real
    # xgboost.XGBRegressor class available, so it's a direct dependency here.
    "xgboost>=3.1.2",
]

[project.scripts]
etaval = "etaval.cli.main:app"
etaval-api = "etaval.api.app:main"

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.uv.sources]
eta_prediction = { path = "../gtfs-eta", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etaval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
