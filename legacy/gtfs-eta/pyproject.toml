[project]
name = "gtfs-eta"
version = "0.1.0"
description = "Utilities for exploring GTFS-Realtime feeds (Vehicle Positions, Trip Updates, Alerts)."
authors = [
    { name = "Jæ" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

# Core inference dependencies only: what eta_service.estimator.estimate_stop_times
# and its transitive imports (core/, feature_engineering/temporal.py,
# models/common/registry.py, models/polyreg_distance/predict.py) genuinely need
# to load a registered model and serve a prediction. Everything else (training,
# the Django/celery collector, plotting) lives behind the extras below so that
# installing the inference path doesn't drag in xgboost, matplotlib, Django, or
# celery.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.3.3",
  "scikit-learn>=1.7.2",
  "holidays>=0.40",
]

[project.optional-dependencies]
# Dataset builder (feature_engineering/dataset_builder.py, weather.py — both
# need Django ORM access to the gtfs-rt-pipeline schema/settings) + model
# training (models/*/train.py, models/train_all_models.py).
train = [
  "Django>=5.0",
  "django-environ>=0.11",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "psycopg[binary,pool]>=3.2.11",
  "fastparquet>=2024.11.0",
  "xgboost>=3.1.2",
]
# The Django/celery GTFS-RT collector (gtfs-rt-pipeline/). That app also ships
# its own standalone pyproject.toml (gtfs-rt-pipeline/pyproject.toml) for
# running it in isolation; this extra exists so `uv sync --extra collect` at
# the repo root can pull in the same stack without cd'ing into that directory.
collect = [
  "Django>=5.0",
  "celery>=5.4",
  "redis>=5.0",
  "psycopg[binary,pool]>=3.2.11",
  "django-environ>=0.11",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "gtfs-realtime-bindings>=1.0.0",
]
# models/evaluation/roll_validate.py plotting only.
viz = [
  "matplotlib>=3.9.4",
]
all = [
  "gtfs-eta[train,collect,viz]",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# gtfs_eta* is the transitional alias namespace (gtfs_eta/__init__.py +
# gtfs_eta/seed_baseline_model.py) — see gtfs_eta/__init__.py for why it's a
# sys.modules alias onto the four packages below rather than their new home.
include = ["core*", "eta_service*", "feature_engineering*", "models*", "gtfs_eta*"]

[tool.uv]
package = true

# No [tool.uv.workspace] block: it previously listed "feature_engineering/proj"
# (does not exist on disk) and "feature_engineering" (exists, but is already
# part of this project's own package tree per [tool.setuptools.packages.find]
# above — declaring it as a separate workspace member conflicted with that).
# feature_engineering/pyproject.toml still exists on disk as a leftover,
# differently-scoped package definition (geopandas/shapely/pyproj/scipy —
# none of which anything under feature_engineering/*.py actually imports);
# left in place but not wired up, since resolving that predates this pass.
